[package]
name = "omamonero-core"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Privacy-conscious node companion for Omarchy Quattro"

[dependencies]
monero = { version = "0.22", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
