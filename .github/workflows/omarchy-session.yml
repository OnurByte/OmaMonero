name: Omarchy session checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    # Explicit dispatch only: requires a trusted runner in a real Wayland session.
    runs-on: [self-hosted, linux, omarchy]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-plugin.py
      - run: python3 scripts/lint-qml.py
      - run: python3 scripts/test-qml-runtime.py
      - run: python3 scripts/test-http-cancel.py
      - run: python3 scripts/test-plugin-lifecycle.py
      - run: python3 scripts/test-config-io.py
      - run: python3 scripts/test-chart-render.py
