name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- qml/v0_4_3/generated/Core.js
      - run: npm audit --audit-level=moderate
      - run: npm run test:presentation
      - run: python3 scripts/check-contract.py
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Official Omarchy validator (pinned Quattro contract)
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/omacom/omarchy/717175d4a8c5a12f6c0fff10dcc3c1c08ef3a0d1/bin/omarchy-plugin-validate -o /tmp/omarchy-plugin-validate
          python3 scripts/validate-plugin.py /tmp/omarchy-plugin-validate
      - name: Deterministic native plugin archive
        run: |
          python3 scripts/package.py
          cp dist/SHA256SUMS /tmp/first-checksums
          python3 scripts/package.py
          cmp /tmp/first-checksums dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omamonero-plugin-0.4.3
          path: |
            dist/omamonero-plugin-0.4.3.tar.gz
            dist/SHA256SUMS
