name: Publish prebuilt backend

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          test "${GITHUB_REF_NAME}" = "release/v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and test matching backend
        run: |
          cargo test --workspace --locked
          cargo build --release --locked
          python3 scripts/check-contract.py
          python3 -m unittest discover -s tests -p '*_test.py'
          python3 scripts/bundle.py
      - name: Publish prebuilt release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            "dist/omamonero-${VERSION}-linux-x86_64.tar.gz" \
            "dist/omamonero-${VERSION}-linux-x86_64.sha256" \
            --target "$GITHUB_SHA" \
            --title "OmaMonero ${VERSION}" \
            --notes "Native Omarchy plugin. Install with: omarchy plugin add https://github.com/OnurByte/OmaMonero.git --enable. Open XMR > Settings to install the matching user-only backend. Linux x86_64; not marketplace-verified."
